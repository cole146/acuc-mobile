name: acuc_jobs
description: ACUC Jobs — find jobs, apply, track applications and chat (native app for acuc.jobs).
publish_to: 'none'
version: 2.0.0+2000

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: '>=9.0.0 <11.0.0'
  shared_preferences: ^2.2.0
  webview_flutter: ^4.7.0
  webview_flutter_android: '>=3.16.0 <6.0.0'
  url_launcher: ^6.2.0
  cached_network_image: ^3.3.0
  flutter_widget_from_html_core: '>=0.14.0 <1.0.0'
  file_picker: '>=8.0.0 <12.0.0'
  share_plus: '>=11.0.0 <13.0.0'
  local_auth: '>=2.1.0 <4.0.0'
  permission_handler: '>=11.0.0 <13.0.0'

dev_dependencies:
  flutter_lints: '>=3.0.0 <7.0.0'

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
