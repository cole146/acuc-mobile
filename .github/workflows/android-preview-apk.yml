name: Android preview APK

# One click, no setup needed: builds an installable test APK (debug-signed).
# Without the Firebase secret, push notifications and Google sign-in are left out
# (password, Face ID / fingerprint, Apple-free login, files, camera and links all work).
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      - name: Firebase config (optional)
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            bash scripts/configure-firebase.sh
          else
            echo "No Firebase config: building without push / Google sign-in so the app still starts."
            npm uninstall --no-save @capacitor-firebase/authentication @capacitor-firebase/messaging
          fi
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          VERSION=$(node -p "require('../package.json').version")
          ./gradlew --no-daemon assembleDebug -PacucVersionCode=$((1000 + ${{ github.run_number }})) -PacucVersionName="$VERSION-preview"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ACUC-Jobs-$VERSION-preview.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: ACUC-Jobs-preview-apk
          path: ACUC-Jobs-*-preview.apk
      - name: Publish as a release (direct download link for phones)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="preview-${{ github.run_number }}"
          gh release create "$TAG" ACUC-Jobs-*-preview.apk --target "$GITHUB_SHA" --prerelease \
            --title "ACUC Jobs preview APK #${{ github.run_number }}" \
            --notes "Test build for Android. Download the .apk on your phone, open it, and allow installing from this source."
      - name: Keep a copy on the apk-builds branch
        run: |
          mkdir -p /tmp/out && cp ACUC-Jobs-*-preview.apk /tmp/out/
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git switch --orphan apk-builds
          git rm -rq --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/out/*.apk . && git add *.apk && git commit -qm "Preview APK #${{ github.run_number }}"
          git push -f origin apk-builds

