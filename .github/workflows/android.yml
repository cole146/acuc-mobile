name: Android release

on:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload to Google Play (internal testing)
        type: boolean
        default: true
  push:
    tags: ['v*']

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      - name: Firebase config
        run: bash scripts/configure-firebase.sh
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
      - run: npx cap sync android
      - name: Signing key
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 --decode > "$RUNNER_TEMP/acuc-upload.jks"
      - name: Build AAB + APK
        working-directory: android
        env:
          ACUC_KEYSTORE_FILE: ${{ runner.temp }}/acuc-upload.jks
          ACUC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ACUC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ACUC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          VERSION=$(node -p "require('../package.json').version")
          ./gradlew --no-daemon bundleRelease assembleRelease \
            -PacucVersionCode=$((1000 + ${{ github.run_number }})) -PacucVersionName="$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: acuc-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
      - name: Upload to Google Play (internal testing)
        if: ${{ github.event_name == 'push' || inputs.upload }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: jobs.acuc.app
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
