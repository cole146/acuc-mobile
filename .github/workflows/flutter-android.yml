name: Flutter Android release

# Builds the native (Flutter) ACUC Jobs app for Google Play: package jobs.acuc.app,
# version code 2000 + run number (always above the old app's codes).
# With the signing secrets set the bundle is signed here; without them it is left unsigned
# and signed afterwards with the upload key.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['flutter_app/**', '.github/workflows/flutter-android.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true

      - name: Versions
        run: |
          echo "CODE=$((2000 + ${{ github.run_number }}))" >> "$GITHUB_ENV"
          echo "NAME=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')" >> "$GITHUB_ENV"

      - run: flutter pub get

      - name: Analyze (errors fail the build)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Signing key (optional)
        if: env.HAS_KEY == 'true'
        env:
          KS64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KS64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/acuc-upload.jks"
          echo "ACUC_KEYSTORE_FILE=$RUNNER_TEMP/acuc-upload.jks" >> "$GITHUB_ENV"

      - name: Build app bundle
        env:
          ACUC_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ACUC_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ACUC_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          flutter build appbundle --release --build-number=$CODE --build-name=$NAME 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          SUFFIX=$([ "$HAS_KEY" = "true" ] && echo "" || echo "-unsigned")
          cp build/app/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/dist/ACUC-Jobs-$NAME-$CODE$SUFFIX.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: acuc-flutter-${{ github.run_number }}
          path: dist/

      - name: Publish as a release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "flutter-${{ github.run_number }}" dist/* --target "$GITHUB_SHA" --prerelease \
            --title "ACUC Jobs (native) $NAME ($CODE)" \
            --notes "Native Flutter build of ACUC Jobs."

      - name: Share the build log when the build fails
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f build.log ] || exit 0
          grep -nE "error|Error|FAILURE|What went wrong|Could not|e: " build.log | tail -150 > build-errors.txt || true
          echo "----- tail -----" >> build-errors.txt
          tail -150 build.log >> build-errors.txt
          gh release delete flutter-build-log --yes --cleanup-tag 2>/dev/null || true
          gh release create flutter-build-log build-errors.txt --target "$GITHUB_SHA" --prerelease --title "Last failed Flutter build log" --notes "Run ${{ github.run_number }}"
